<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Brand</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
  color: #111;
}

header {
  height: 100vh;
  background: url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
}

.overlay {
  background: rgba(0,0,0,0.4);
  padding: 40px;
  text-align: center;
  color: white;
}

h1 {
  font-size: 48px;
  margin-bottom: 10px;
}

p {
  font-size: 18px;
}

.btn {
  display: inline-block;
  margin-top: 20px;
  padding: 12px 30px;
  background: #c8102e;
  color: white;
  text-decoration: none;
  border-radius: 5px;
}

section {
  padding: 80px 20px;
  text-align: center;
}

.grid {
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.card h3 {
  margin: 10px 0;
}

footer {
  background: #111;
  color: #aaa;
  padding: 40px;
}
</style>

</head>
<body>

<header>
  <div class="overlay">
    <h1>Fresh. Fast. Delicious.</h1>
    <p>Real food made with real ingredients</p>
    <a href="#" class="btn">Order Now</a>
  </div>
</header>

<section>
  <h2>Our Menu</h2>
  <div class="grid">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd">
      <h3>Burgers</h3>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
      <h3>Fries</h3>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1600891964092-4316c288032e">
      <h3>Combos</h3>
    </div>
  </div>
</section>

<section>
  <h2>Why Choose Us</h2>
  <p>Fresh ingredients. Fast service. Great taste.</p>
</section>

<footer>
  <p>© Food Brand</p>
</footer>

</body>
</html>
