<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<title>Stinky Pete's Pet Grooming</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#fff;
  color:#111;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  background:#fff;
}

nav a{
  margin:0 10px;
  text-decoration:none;
  color:#333;
}

.hero{
  height:90vh;
  background:url('https://images.unsplash.com/photo-1583511655857-d19b40a7a54e') center/cover;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  text-align:center;
}

.overlay{
  background:rgba(0,0,0,0.6);
  padding:40px;
  border-radius:10px;
}

.hero h1{
  font-size:42px;
}

.btn{
  margin-top:20px;
  padding:12px 25px;
  background:#00cc66;
  color:white;
  text-decoration:none;
  border-radius:30px;
}

section{
  padding:80px 20px;
  text-align:center;
}

.container{
  max-width:1100px;
  margin:auto;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-6px);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card h3{
  padding:15px;
}

iframe{
  width:100%;
  border-radius:10px;
}

footer{
  background:#111;
  color:white;
  padding:40px 20px;
}

footer a{
  color:#aaa;
  display:block;
  text-decoration:none;
  margin:5px 0;
}

.call{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#00cc66;
  color:white;
  padding:15px;
  border-radius:50%;
  text-decoration:none;
}

@media(max-width:768px){
  .hero h1{font-size:28px;}
}
</style>
</head>

<body>

<header>
  <h2>Stinky Pete's</h
