<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetCare Premium</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
  color: #111;
}

/* HEADER */
header {
  background: white;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 0;
  z-index: 10;
}

/* HERO */
.hero {
  padding: 120px 20px 80px;
  text-align: center;
}

.hero h1 {
  font-size: 34px;
}

.btn {
  margin-top: 20px;
  padding: 12px 25px;
  background: #00cc66;
  color: white;
  text-decoration: none;
  border-radius: 5px;
}

/* SECTIONS */
section {
  padding: 70px 20px;
  text-align: center;
}

/* CARDS */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px,1fr));
  gap: 20px;
  max-width: 1000px;
  margin: auto;
}

.card {
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-6px);
}

.card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
}

/* BEFORE AFTER */
.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  max-width: 800px;
  margin: auto;
}

.split img {
  width: 100%;
  border-radius: 10px;
}

/* TESTIMONIALS */
.testimonial {
  background: #f5f5f5;
  padding: 20px;
  border-radius: 10px;
  margin: 10px auto;
  max-width: 600px;
}

/* MAP */
iframe {
  width: 100%;
  border-radius: 10px;
}

/* FOOTER */
footer {
  background: #111;
  color: white;
  padding: 40px 20px;
}

footer a {
  color: #aaa;
  display: block;
  text-decoration: none;
  margin: 5px 0;
}

/* WHATS FLOAT */
.whatsapp {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #00cc66;
  color: white;
  padding: 15px;
  border-radius: 50%;
  text-decoration: none;
  font-weight: bold;
}

/* ANIMATION */
.fade {
  opacity: 0;
  transform: translateY(20px);
  transition: 0.6s;
}

.fade.show {
  opacity: 1;
  transform: translateY(0);
}

/* RESPONSIVO */
@media(max-width:768px){
  .split {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h2>PetCare</h2>
</header>

<section class="hero fade">
  <h1>Cuidado premium para seu pet</h1>
  <p>Transformando a experiência do seu melhor amigo</p>
  <a href="https://wa.me/5599999999999" class="btn">Agendar agora</a>
</section>

<section class="fade">
  <h2>Serviços</h2>
  <div class="cards">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1518717758536-85ae29035b6d">
      <h3>Banho & Tosa</h3>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba">
      <h3>Veterinário</h3>
    </div>
  </div>
</section>

<section class="fade">
  <h2>Antes e Depois</h2>
  <div class="split">
    <img src="https://images.unsplash.com/photo-1518717758536-85ae29035b6d">
    <img src="https://images.unsplash.com/photo-1558788353-f76d92427f16">
  </div>
</section>

<section class="fade">
  <h2>Depoimentos</h2>
  <div class="testimonial">"Meu pet saiu outro!"</div>
  <div class="testimonial">"Atendimento perfeito."</div>
</section>

<section class="fade">
  <h2>Localização</h2>
  <iframe src="https://www.google.com/maps?q=São+Paulo&output=embed" height="300"></iframe>
</section>

<footer>
  <h3>Informações</h3>
  <a href="privacidade.html">Privacidade</a>
  <a href="termos.html">Termos</a>
</footer>

<a href="https://wa.me/5599999999999" class="whatsapp">W</a>

<script>
const faders = document.querySelectorAll('.fade');

window.addEventListener('scroll', () => {
  faders.forEach(el => {
    const top = el.getBoundingClientRect().top;
    if(top < window.innerHeight - 50){
      el.classList.add('show');
    }
  });
});
</script>

</body>
</html>
