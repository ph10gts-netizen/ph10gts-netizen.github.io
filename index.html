<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stinky Pete's Pet Grooming</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

header {
    display: flex;
    justify-content: space-between;
    padding: 20px;
    background: white;
    font-weight: bold;
}

nav a {
    margin-left: 15px;
    text-decoration: none;
    color: black;
}

.hero {
    height: 300px;
    background: url("https://images.unsplash.com/photo-1558788353-f76d92427f16") center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 30px;
    font-weight: bold;
}

.section {
    padding: 40px 20px;
}

.cards {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.card h3 {
    text-align: center;
    padding: 15px;
}

.map {
    width: 100%;
    height: 300px;
    border: none;
}

footer {
    background: black;
    color: white;
    padding: 30px 20px;
    margin-top: 40px;
}

footer a {
    display: block;
    color: white;
    text-decoration: none;
    margin-bottom: 8px;
}
</style>
</head>

<body>

<header>
    <div>Stinky Pete's</div>
    <nav>
        <a href="#work">Work</a>
        <a href="#location">Location</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<div class="hero">
    Professional Dog Grooming
</div>

<section class="section" id="work">
    <h2>Our Work</h2>
    <div class="cards">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1516734212186-a967f81ad0d7">
            <h3>Bath & Brushing</h3>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1601758125946-6ec2ef64daf8">
            <h3>Ear Cleaning</h3>
        </div>

        <div class="card">
            <!-- ✅ IMAGEM CORRIGIDA AQUI -->
            <img src="https://images.unsplash.com/photo-1598137260178-cd1f9f6c42d4">
            <h3>Haircut & Grooming</h3>
        </div>

    </div>
</section>

<section class="section" id="location">
    <h2>Location</h2>
    <iframe class="map"
        src="https://maps.google.com/maps?q=Michigan&t=&z=13&ie=UTF8&iwloc=&output=embed">
    </iframe>
</section>

<section class="section" id="contact">
    <h2>Contact</h2>
    <p>Phone: (555) 123-4567</p>
    <p>Email: contact@stinkypetes.com</p>
</section>

<footer>
    <p>© 2026 Stinky Pete's Pet Grooming</p>

    <a href="#">Privacy Policy</a>
    <a href="#">Terms of Use</a>
    <a href="#">Accessibility Statement</a>
    <a href="#">Cookie Policy</a>
</footer>

</body>
</html>
